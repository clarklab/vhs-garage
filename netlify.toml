[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Serve /tik slide images under the /tik prefix so ONE TikTok URL-property
# verification of https://<domain>/tik covers them. The images physically live
# in the tik-media function; status = 200 is an internal REWRITE (proxy), not a
# 3xx redirect — TikTok's PULL_FROM_URL forbids redirects, and a rewrite returns
# the image bytes directly at /tik/media/<id>.
[[redirects]]
  from = "/tik/media/:id"
  to = "/.netlify/functions/tik-media?id=:id"
  status = 200

# The Quote-a-long video format's clip, under the same /tik prefix and for the
# same reason: one verified URL property covers both the images and the video.
[[redirects]]
  from = "/tik/video/:id"
  to = "/.netlify/functions/tik-video?id=:id"
  status = 200

# During active development we want every page refresh to pull the latest
# deploy — testers (some non-technical) shouldn't have to figure out hard
# refresh / DevTools to see new code. Disable browser caching for the
# whole site for now; revisit and tighten once the codebase calms down.
[[headers]]
  for = "/*"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
    Pragma = "no-cache"
    Expires = "0"

# ffmpeg.wasm runtime files are large (~24MB wasm) and change only when
# we deliberately bump @ffmpeg/core (an exact-pinned dep). Override the
# global no-store so the browser can actually keep these around between
# uploads — without this, the heavy audio pass would re-download the
# full wasm on every page load and the same-origin hosting choice
# would lose most of its value.
[[headers]]
  for = "/ffmpeg/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
